name: CI

# Corre en cada push a las ramas de integración y en cada PR que apunte a ellas.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Si se empujan varios commits seguidos a la misma rama/PR, cancela las corridas viejas
# y deja solo la última, para no gastar minutos de CI de gusto.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # npm ci = install reproducible desde package-lock.json (falla si el lock está desincronizado).
      - name: Install dependencies
        run: npm ci

      # La suite usa mongodb-memory-server, así que no hace falta un servicio de Mongo en CI.
      - name: Run tests
        run: npm test

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Valida que la imagen construya de punta a punta (incluye compilar bcrypt nativo).
      # No se hace push a ningún registro: es solo una verificación de que el Dockerfile funciona.
      - name: Build image
        run: docker build -t schoolartask-backend:ci .
